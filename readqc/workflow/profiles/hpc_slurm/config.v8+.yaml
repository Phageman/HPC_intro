executor: slurm

default-resources:
  slurm_partition: "cpu"
  slurm_account: "dla_mm"   # your group's Slurm account, e.g. "umcu_mmb_nd"
  mem_mb: 1000
  runtime: 10

restart-times: 0
max-jobs-per-timespan: "100/1s"
max-status-checks-per-second: 10
latency-wait: 60
jobs: "unlimited"
keep-going: True
rerun-incomplete: True
printshellcmds: False
scheduler: greedy
use-conda: True

set-resources:
  fastp:
    mem_mb: 2000
    runtime: 10
